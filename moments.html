  <script src="assets/gallery-data.js"></script>
  <script>
    (function () {
      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      }

      var images   = shuffle(window.galleryImages || []);
      var wrap     = document.getElementById('slideshow');
      var thumbsEl = document.getElementById('slideshowThumbs');
      if (!wrap || images.length === 0) return;

      var overlay = wrap.querySelector('.slideshow-overlay');

      var imgEls = images.map(function (src, i) {
        var img       = document.createElement('img');
        img.className = 'slideshow-img';
        img.src       = src;
        img.alt       = 'Jayant & Anjali';
        img.loading   = i < 3 ? 'eager' : 'lazy';
        wrap.insertBefore(img, overlay);
        return img;
      });

      var thumbEls = images.map(function (src, i) {
        var btn = document.createElement('button');
        btn.className = 'slideshow-thumb';
        btn.setAttribute('aria-label', 'Show photo ' + (i + 1));
        var img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.loading = i < 8 ? 'eager' : 'lazy';
        btn.appendChild(img);
        btn.addEventListener('click', function () { goTo(i); resetTimer(); });
        thumbsEl.appendChild(btn);
        return btn;
      });

      var current  = 0;
      var CYCLE_MS = 7000;
      var timer;

      function goTo(index) {
        imgEls[current].classList.remove('active');
        if (thumbEls[current]) thumbEls[current].classList.remove('active');
        current = ((index % images.length) + images.length) % images.length;
        imgEls[current].classList.add('active');
        if (thumbEls[current]) {
          thumbEls[current].classList.add('active');
          // Keep the active thumbnail in view
          thumbEls[current].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }

      function resetTimer() {
        clearInterval(timer);
        timer = setInterval(function () { goTo(current + 1); }, CYCLE_MS);
      }

      // Pause on hover over the slideshow itself
      wrap.addEventListener('mouseenter', function () { clearInterval(timer); });
      wrap.addEventListener('mouseleave', function () { resetTimer(); });

      goTo(0);
      resetTimer();
    })();
  </script>
