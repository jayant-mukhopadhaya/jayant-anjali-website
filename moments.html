  <main>
    <div class="slideshow-wrap" id="slideshow">
      <div class="slideshow-overlay"></div>
      <div class="slideshow-title">
        <h1 class="page-title">Moments</h1>
      </div>
      <div class="slideshow-dots" id="slideshowDots"></div>
    </div>

  <script src="assets/gallery-data.js"></script>
  <script>
    (function () {
      // Fisher-Yates shuffle
      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
      }

      var images = shuffle(window.galleryImages || []);
      var wrap   = document.getElementById('slideshow');
      var dotsEl = document.getElementById('slideshowDots');
      if (!wrap || images.length === 0) return;

      var overlay = wrap.querySelector('.slideshow-overlay');

      var imgEls = images.map(function (src, i) {
        var img      = document.createElement('img');
        img.className = 'slideshow-img';
        img.src       = src;
        img.alt       = 'Jayant & Anjali';
        img.loading   = i < 3 ? 'eager' : 'lazy';
        wrap.insertBefore(img, overlay);
        return img;
      });

      var dotEls = images.map(function (_, i) {
        var btn = document.createElement('button');
        btn.className = 'slideshow-dot';
        btn.setAttribute('aria-label', 'Slide ' + (i + 1));
        btn.addEventListener('click', function () { goTo(i); resetTimer(); });
        dotsEl.appendChild(btn);
        return btn;
      });

      if (images.length > 20) dotsEl.style.display = 'none';

      var current  = 0;
      var CYCLE_MS = 7000;
      var timer;

      function goTo(index) {
        imgEls[current].classList.remove('active');
        if (dotEls[current]) dotEls[current].classList.remove('active');
        current = ((index % images.length) + images.length) % images.length;
        imgEls[current].classList.add('active');
        if (dotEls[current]) dotEls[current].classList.add('active');
      }

      function resetTimer() {
        clearInterval(timer);
        timer = setInterval(function () { goTo(current + 1); }, CYCLE_MS);
      }

      goTo(0);
      resetTimer();
    })();
  </script>

  <script src="script.js"></script>
