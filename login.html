<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow">
    <title>Welcome · Jayant &amp; Anjali</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="Indian Motif Exports/Lion_1.png">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="login-stage">
        <div class="login-card">
            <div class="login-title-wrap">
                <img class="login-parrot" src="Indian Motif Exports/parrot_left.png" alt="">
                <h1 class="login-title">JAYANT<br>&amp;ANJALI</h1>
                <img class="login-parrot" src="Indian Motif Exports/Parrot_right.png" alt="">
            </div>
            <p class="login-sub">November 21–22, 2026 &nbsp;·&nbsp; Goa, India</p>

            <form id="loginForm" class="login-form" autocomplete="off">
                <label class="login-field">
                    <span>Password</span>
                    <input type="password" id="password" placeholder="From your invitation" required>
                </label>
                <button type="submit" class="btn btn--primary login-submit">Enter</button>
                <p id="error" class="login-error">Incorrect password. Please try again.</p>
            </form>
        </div>
    </main>

    <script>
        (function () {
            var form  = document.getElementById('loginForm');
            var pass  = document.getElementById('password');
            var error = document.getElementById('error');

            function submit() {
                error.style.display = 'none';
                if (pass.value === 'kokumsoda') {
                    sessionStorage.setItem('wedding_auth', 'true');
                    window.location.href = 'index.html';
                } else {
                    error.style.display = 'block';
                    pass.focus();
                    pass.select();
                }
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                submit();
            });
        })();
    </script>
</body>

</html>
