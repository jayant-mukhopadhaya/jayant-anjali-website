<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow">
    <title>Welcome · Jayant &amp; Anjali</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="Indian Motif Exports/Lion_1.png">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="login-stage">
        <div class="login-card">
            <h1 class="login-title-banner">
                <img src="Indian Motif Exports/Red Emboss Motifs/J&amp;A banner_red_text_only.png" alt="Jayant &amp; Anjali">
            </h1>
            <p class="login-sub">November 21–22, 2026 &nbsp;·&nbsp; Goa, India</p>

            <form id="loginForm" class="login-form" autocomplete="off">
                <label class="login-field">
                    <span>Password</span>
                    <div class="login-input-wrap">
                        <input type="password" id="password" placeholder="Hmmm, what could it be..." required>
                        <button type="submit" class="login-submit-arrow" aria-label="Enter">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M5 12h14M13 6l6 6-6 6"/>
                            </svg>
                        </button>
                    </div>
                </label>
                <p id="error" class="login-error">Incorrect password. Please try again.</p>
            </form>
        </div>
    </main>

    <script>
        (function () {
            var form  = document.getElementById('loginForm');
            var pass  = document.getElementById('password');
            var error = document.getElementById('error');

            function submit() {
                error.style.display = 'none';
                if (pass.value === 'kokumsoda') {
                    sessionStorage.setItem('wedding_auth', 'true');
                    window.location.href = 'index.html';
                } else {
                    error.style.display = 'block';
                    pass.focus();
                    pass.select();
                }
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                submit();
            });
        })();
    </script>
</body>

</html>
